<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Idea Catcher · Dan Koe's process</title>
<meta name="theme-color" content="#0e0f12">
<meta name="description" content="Capture content ideas and turn them into posts, following Dan Koe's idea museum process.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ideas">
<style>
:root{
  --bg:#0e0f12;--panel:#16181d;--panel2:#1d2027;--line:#2a2e37;--text:#eceef2;--muted:#9aa1ad;
  --accent:#f5c451;--accent2:#7cc4ff;--good:#6fd39a;--bad:#ff7a7a;--fav:#ff9ec7;--val:#7cc4ff;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif}
a{color:var(--accent2)}
header{position:sticky;top:0;z-index:5;background:rgba(14,15,18,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;padding:12px 18px;max-width:1100px;margin:0 auto}
.logo{font-weight:800;letter-spacing:-.02em;font-size:18px}
.logo span{color:var(--accent)}
.top .sp{flex:1}
nav{display:flex;gap:6px;overflow-x:auto;padding:0 18px 10px;max-width:1100px;margin:0 auto;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{flex:0 0 auto;border:1px solid var(--line);background:var(--panel);color:var(--muted);padding:7px 12px;border-radius:999px;cursor:pointer;font:inherit;font-size:13px;white-space:nowrap}
nav button b{color:var(--text);font-weight:600;margin-right:4px}
nav button.on{background:var(--accent);color:#1a1405;border-color:var(--accent)}
nav button.on b{color:#1a1405}
main{max-width:1100px;margin:0 auto;padding:22px 18px 80px}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px}
h2{font-size:17px;margin:0 0 10px}
h3{font-size:14px;margin:0 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.kicker{color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.lead{color:var(--muted);margin:0 0 18px;max-width:760px}
.quote{border-left:3px solid var(--accent);padding:8px 14px;margin:0 0 18px;color:#d8dbe2;background:var(--panel);border-radius:0 10px 10px 0;font-style:italic}
.quote small{display:block;color:var(--muted);font-style:normal;margin-top:4px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
@media(max-width:760px){.grid2,.grid3{grid-template-columns:1fr}h1{font-size:22px}}
label{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px}
input,textarea,select{width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px 12px;font:inherit}
textarea{min-height:80px;resize:vertical}
input:focus,textarea:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.btn{border:1px solid var(--line);background:var(--panel2);color:var(--text);border-radius:10px;padding:9px 14px;cursor:pointer;font:inherit;font-size:14px}
.btn:hover{border-color:#444a57}
.btn.p{background:var(--accent);border-color:var(--accent);color:#1a1405;font-weight:700}
.btn.s{padding:5px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg label{margin:0;display:flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--panel2);padding:7px 11px;border-radius:999px;cursor:pointer;color:var(--text);font-size:13px}
.seg input{width:auto;margin:0}
.pill{display:inline-block;font-size:11.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.pill.fav{color:var(--fav);border-color:#5a3346}.pill.val{color:var(--val);border-color:#24435c}.pill.ok{color:var(--good);border-color:#24503a}
.idea{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
.idea p{margin:0 0 8px;white-space:pre-wrap}
.meta{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.empty{color:var(--muted);font-size:14px;padding:14px;border:1px dashed var(--line);border-radius:12px;text-align:center}
.prompt{position:relative;background:#0b0c0f;border:1px solid var(--line);border-radius:12px;padding:14px 14px 14px;white-space:pre-wrap;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:#dfe3ea}
.prompt .btn{position:absolute;top:8px;right:8px}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid var(--line)}
.check:last-child{border-bottom:0}
.check input{width:18px;height:18px;margin-top:2px;flex:0 0 auto}
.check .auto{margin-left:auto;font-size:12px;color:var(--muted);white-space:nowrap}
.done{color:var(--good)}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--accent)}
.q{display:grid;grid-template-columns:28px 1fr;gap:10px;margin-bottom:14px}
.q .n{width:28px;height:28px;border-radius:50%;background:var(--accent);color:#1a1405;font-weight:800;display:flex;align-items:center;justify-content:center;font-size:13px}
.q .lab{font-weight:600;margin-bottom:6px}
.rate{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.rate label{margin:0;display:flex;gap:4px;align-items:center;font-size:12px;color:var(--muted);cursor:pointer}
.rate input{width:auto}
.star{cursor:pointer;background:none;border:0;font-size:18px;color:#555;padding:0 4px}
.star.on{color:var(--accent)}
details{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
summary{cursor:pointer;color:var(--muted);font-size:14px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--accent);color:#1a1405;padding:10px 16px;border-radius:10px;font-weight:700;opacity:0;transition:.2s;pointer-events:none;z-index:20}
.toast.on{opacity:1}
.next{display:flex;justify-content:space-between;gap:10px;margin-top:22px;flex-wrap:wrap}
.stat{font-size:28px;font-weight:800;letter-spacing:-.02em}
.small{font-size:12.5px;color:var(--muted)}
.warn{color:var(--accent)}
footer{color:var(--muted);font-size:12px;text-align:center;padding:20px}
.hl{border-color:var(--accent)!important}
main{overflow-wrap:anywhere}
.idea p,.quote,.prompt,h1,h2{overflow-wrap:anywhere}
:focus-visible{outline:3px solid var(--accent2)!important;outline-offset:2px}
.star{color:#9aa1ad}
.pill.cfx{color:#ffb86b;border-color:#6b4a24}
.banner{background:#2a2111;border:1px solid #6b5420;border-radius:12px;padding:12px 14px;margin-bottom:14px;font-size:14px}
.banner .row{margin-top:8px}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:middle}
.qr{background:#fff;border-radius:12px;padding:6px;width:min(320px,100%);margin:4px 0 12px}
.qr svg{display:block;width:100%;height:auto}
.toast.undo{pointer-events:auto;display:flex;gap:12px;align-items:center}
.toast .btn{padding:6px 12px;background:#1a1405;color:var(--accent);border-color:#1a1405}
label.check{margin:0;color:var(--text);font-size:15px;cursor:pointer}
@media (max-width:1024px),(pointer:coarse){
  .btn,nav button,.seg label,.rate label,label.check,.star{min-height:44px}
  .btn{min-width:44px}
  .btn.s{padding:8px 12px}
  .star{min-width:44px}
  .rate label{padding:0 6px}
  input,select{min-height:44px}
  .check input{width:22px;height:22px}
}

</style>
</head>
<body>
<header>
  <div class="top">
    <div class="logo">Idea <span>Catcher</span></div>
    <div class="sp"></div>
    <button class="btn s ghost" id="syncPill" data-act="openSync">Sync</button>
    <button class="btn s ghost" data-act="export" title="Download all your data as JSON">Export</button>
    <button class="btn s ghost" data-act="import" title="Load a JSON backup (merges, never deletes)">Import</button><input id="importFile" type="file" accept="application/json,.json" hidden aria-label="Import backup file">
  </div>
  <nav id="nav"></nav>
</header>
<main id="app"></main>
<footer>Built on Dan Koe's "The influencer is dead. The Age of Experience is here." · <a href="https://x.com/thedankoe/status/2112586533610156368" target="_blank" rel="noopener">Read the article</a> · Data stays in this browser (localStorage). Export to back up; Import merges a backup in without deleting anything.</footer>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
const KEY = "ideaCatcher.v1", UIKEY = KEY+".ui", BAK = KEY+".bak";
const VERSION = 2;
const ARTICLE = "https://x.com/thedankoe/status/2112586533610156368";
const COLS = ["ideas","sources","creators","posts","guides"];
const SINGLES = ["settings","plan"];
const LIM = 100;

const STEPS = [
  {id:"start",  n:"0",  label:"Start & 30-day plan"},
  {id:"museum", n:"A1", label:"Idea museum"},
  {id:"density",n:"A2", label:"Dense sources"},
  {id:"study",  n:"B1", label:"Study what works"},
  {id:"angle",  n:"B2", label:"Find your angle"},
  {id:"draft",  n:"✎",  label:"Merge & post"},
  {id:"listen", n:"W3", label:"Replies & questions"},
  {id:"guide",  n:"W4", label:"One-page guide"}
];
const CAPTURE_TYPES = ["Random thought","Social post that inspired me","Video note","Anything else"];
const SOURCE_KINDS = ["Old or little-known book","Curated blog or account","Creator who always posts something worth thinking about"];
const SOURCE_GROUPS = ["Old or little-known books","Curated blogs and accounts","Creators who always post something worth thinking about"];
const PLATFORMS = ["TikTok video","X post","Newsletter","Instagram","LinkedIn","Other"];
const ANGLE_QS = [
  "How would [a thinker I love] say this?",
  "How would I say this to my past self?",
  "How can I redefine the idea?",
  "What is the common perspective, and what do I disagree with?",
  "Why does this matter to the everyday person?"
];
// Form fields that survive navigation, reloads and closed tabs (no lost work mid-edit)
const FORM = new Set(["capText","capType","capSource","capWhy","srcName","srcKind","srcUrl","srcNote","crName","crUrl","crNote","swText","swUrl","swWhy","swPrin","opText","drPlat","drText","gQText"]);

/* ---------- helpers ---------- */
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = (sel,root=document)=>root.querySelector(sel);
const fmt = t => { const d=new Date(t); return isNaN(d)?"":d.toLocaleDateString(undefined,{month:"short",day:"numeric"}); };
const dayKey = t => { const d=new Date(t); return d.getFullYear()+"-"+(d.getMonth()+1)+"-"+d.getDate(); };
const clone = o => JSON.parse(JSON.stringify(o));
const isObj = o => !!o && typeof o==="object" && !Array.isArray(o);
const str = v => v==null ? "" : (typeof v==="string" ? v : (typeof v==="number"||typeof v==="boolean" ? String(v) : ""));
const num = v => { const n=+v; return isFinite(n)?n:0; };
const okId = v => typeof v==="string" && /^[\w~-]{1,80}$/.test(v);

/* ---------- content hashing (for safe merging between tabs, backups and future devices) ---------- */
const META = new Set(["_h","_hist","updatedAt"]);
// Empty values ("" / 0 / false / null / empty lists) count as "not set", so a freshly created item and the
// same item after a save/load round trip (which fills in defaults) hash identically.
function isEmpty(v){ if(v==null||v===""||v===false||v===0) return true; if(Array.isArray(v)) return v.every(isEmpty); if(typeof v==="object") return Object.keys(v).every(k=>isEmpty(v[k])); return false; }
function stable(v){
  if(v===null||typeof v!=="object") return JSON.stringify(v===undefined?null:v);
  if(Array.isArray(v)) return "["+v.map(stable).join(",")+"]";
  return "{"+Object.keys(v).filter(k=>!META.has(k)&&!isEmpty(v[k])).sort().map(k=>JSON.stringify(k)+":"+stable(v[k])).join(",")+"}";
}
function hash(o){ const s=stable(o); let h=0x811c9dc5; for(let i=0;i<s.length;i++){ h^=s.charCodeAt(i); h=Math.imul(h,16777619); } return (h>>>0).toString(36)+"."+s.length.toString(36); }

  const h=hash(o);
  if(o._h!==h){ if(o._h){ o._hist=(o._hist||[]).concat(o._h).slice(-30); } o._h=h; o.updatedAt=Date.now(); }
  return o;
}
const byCreated = (a,b)=> (a.createdAt-b.createdAt) || (a.id<b.id?-1:a.id>b.id?1:0);
function stampAll(d){
  COLS.forEach(c=>{ d[c].forEach(stamp); d[c].sort(byCreated); });
  SINGLES.forEach(k=>stamp(d[k]));
  const cut=Date.now()-180*864e5; for(const id in d.deleted) if(d.deleted[id].at<cut) delete d.deleted[id];
}

/* ---------- data model ---------- */
function blank(){
  const d = {
    app:"idea-catcher", version:VERSION,
    settings:{topics:"", thinkers:""},
    ideas:[], sources:[], creators:[], posts:[], guides:[],
    plan:{phone:false, keepGoing:false},
    deleted:{},    // tombstones {id:{at,h}} so a delete on one copy isn't undone by another copy
    conflicts:[]   // settings/plan versions that clashed, kept so nothing is lost
  };
  SINGLES.forEach(k=>{ d[k]._h=hash(d[k]); d[k].updatedAt=0; });
  return d;
}
function blankUi(){ return {tab:"start", angleIdea:"", draftIdea:"", draftValidated:"", draftAngle:"", guideQ:"", filter:"", srcCapture:"", swipeFor:"", form:{}, limits:{}}; }

// Turn anything (old versions, partial backups, hand-edited files) into a valid data object.
// Returns null if it isn't Idea Catcher data at all. Sets lossy=true if something had to be dropped.
function normalize(raw){
  if(!isObj(raw)) return null;
  const known = COLS.concat(SINGLES).some(k=>k in raw);
  if(!known) return null;
  const d = blank(); let lossy=false;
  const meta = (o,src) => { if(typeof src._h==="string") o._h=src._h; if(Array.isArray(src._hist)) o._hist=src._hist.filter(x=>typeof x==="string").slice(-30); if(src.updatedAt) o.updatedAt=num(src.updatedAt); return o; };
  if(isObj(raw.settings)){ d.settings=meta({topics:str(raw.settings.topics), thinkers:str(raw.settings.thinkers)}, raw.settings); }
  if(isObj(raw.plan)){ d.plan=meta({phone:!!raw.plan.phone, keepGoing:!!raw.plan.keepGoing}, raw.plan); }
  const seen = new Set();
  const fixId = v => { let id=okId(v)?v:uid(); while(seen.has(id)) id=uid(); seen.add(id); return id; };

  d.ideas = list("ideas").map(i=>{
    const o=base(i); o.text=str(i.text); o.type=str(i.type); o.board=i.board==="validated"?"validated":"favorite";
    o.source=str(i.source); o.why=str(i.why); o.principle=str(i.principle); o.creatorId=okId(i.creatorId)?i.creatorId:"";
    if(i.angles!=null){
      const a=isObj(i.angles)?i.angles:{}; const ans=Array.isArray(a.answers)?a.answers:[];
      o.angles={answers:[0,1,2,3,4].map(k=>str(ans[k])), stars:[...new Set((Array.isArray(a.stars)?a.stars:[]).map(Number).filter(k=>k>=0&&k<5&&k%1===0))].slice(-2),
        rate:isObj(a.rate)?a.rate:{}, truth:str(a.truth), extra:str(a.extra)};
    }
    return o;
  });
  d.sources = list("sources").map(s=>{ const o=base(s); o.name=str(s.name); o.kind=SOURCE_KINDS.includes(s.kind)?s.kind:SOURCE_KINDS[0]; o.url=str(s.url); o.note=str(s.note); return o; });
  d.creators = list("creators").map(c=>{ const o=base(c); o.name=str(c.name); o.url=str(c.url); o.note=str(c.note); return o; });
  d.posts = list("posts").map(p=>{ const o=base(p); o.ideaId=okId(p.ideaId)?p.ideaId:""; o.validatedId=okId(p.validatedId)?p.validatedId:"";
    o.angleIdx=(p.angleIdx==null||p.angleIdx==="")?null:num(p.angleIdx); o.platform=str(p.platform)||"Other"; o.text=str(p.text);
    o.status=p.status==="posted"?"posted":"draft"; if(p.postedAt) o.postedAt=num(p.postedAt); o.link=str(p.link); o.replies=Math.max(0,num(p.replies));
    o.questions=(Array.isArray(p.questions)?p.questions:[]).filter(isObj).map(q=>({id:okId(q.id)?q.id:uid(), text:str(q.text)})); return o; });
  d.guides = list("guides").map(g=>{ const o=base(g); o.question=str(g.question); o.postId=okId(g.postId)?g.postId:""; o.title=str(g.title); o.body=str(g.body); o.emailLink=str(g.emailLink);
    o.made=!!g.made; o.out=!!g.out; o.larger=!!g.larger; return o; });
  if(isObj(raw.deleted)) for(const id in raw.deleted){ const t=raw.deleted[id]; if(okId(id)&&isObj(t)) d.deleted[id]={at:num(t.at), h:str(t.h)}; }

}

/* ---------- merge: never silently drop an edit ---------- */
// 0 same, 1 a is newer, -1 b is newer, 2 both changed (conflict)

  const confl = new Map(); a.conflicts.concat(b.conflicts).forEach(c=>confl.set(c.id,c));
  COLS.forEach(c=>{
    const A=new Map(a[c].map(x=>[x.id,x])), B=new Map(b[c].map(x=>[x.id,x]));
    const ids=new Set([...A.keys(),...B.keys()]); const res=new Map();
    for(const id of ids){
      const x=A.get(id), y=B.get(id);
      if(x && y){

        else if(r===1) res.set(id,x);
        else if(r===-1) res.set(id,y);
        else {

          wc._hist=[...new Set([...(w._hist||[]),...(l._hist||[]),l._h])].slice(-30); res.set(id,wc);
          const cid=(id.split("~c")[0]+"~c"+l._h.replace(/\W/g,"")).slice(0,80);
          if(!ids.has(cid) && !res.has(cid)){ const lc=clone(l); lc.id=cid; lc.conflictOf=id; lc.conflictAt=l.updatedAt||0; delete lc._h; delete lc._hist; stamp(lc); res.set(cid,lc); }

        res.set(id,it);
      }

    const x=a[k], y=b[k], r=rel(x,y);

    else if(r===-1) out[k]=y;
    else { const [w,l]=winner(x,y); const wc=clone(w); wc._hist=[...new Set([...(w._hist||[]),...(l._hist||[]),l._h])].slice(-30); out[k]=wc;
      const v=clone(l); delete v._h; delete v._hist; delete v.updatedAt; const cid=k+"~"+l._h; if(!confl.has(cid)) confl.set(cid,{id:cid, what:k, value:v, at:l.updatedAt||0}); }
  });

}

/* ---------- storage ---------- */
let notice = "";
let lastRaw = null;
let S, U;
function readUi(){ try{ const u=JSON.parse(localStorage.getItem(UIKEY)||"null"); if(isObj(u)) return Object.assign(blankUi(),u,{form:isObj(u.form)?u.form:{}, limits:isObj(u.limits)?u.limits:{}}); }catch(_){} return null; }
function load(){
  let raw=null; try{ raw=localStorage.getItem(KEY); }catch(_){}
  U = readUi();
  if(raw==null){ S=blank(); U=U||blankUi(); return; }
  let n=null; try{ n=normalize(JSON.parse(raw)); }catch(_){}
  if(n){
    S=n.data; lastRaw=raw;

  } else {
    keepCopy(raw);

    S = b ? b.data : blank();
    notice = b ? "Your saved data was damaged, so the last good copy from this browser was restored. The damaged version was kept too, nothing was wiped."

    try{ localStorage.setItem(KEY, JSON.stringify(S)); lastRaw=localStorage.getItem(KEY); }catch(_){}
  }

function keepCopy(raw){ try{ localStorage.setItem(KEY+".damaged-"+Date.now(), raw); }catch(_){} }
let saveTimer=0, uiTimer=0, saveErr=0;
function save(){
  clearTimeout(saveTimer); saveTimer=0;
  stampAll(S);
  let changed=false;
  try{
    const cur=localStorage.getItem(KEY);
    if(cur!=null && cur!==lastRaw){   // another tab wrote meanwhile: merge, don't overwrite
      let o=null; try{ o=normalize(JSON.parse(cur)); }catch(_){}
      if(o){ const before=stable(S); S=merge2(S,o.data); changed=stable(S)!==before; }
    }
    const raw=JSON.stringify(S); localStorage.setItem(KEY,raw); lastRaw=raw;
    saveErr=0;
  }catch(e){ saveErr=Date.now(); toast("Couldn't save: this browser's storage is full. Export a backup now.", null, true); }
  saveUi();
  if(changed) setTimeout(renderKeep,0);
  if(typeof scheduleSync==="function") scheduleSync();
}
function saveSoon(){ clearTimeout(saveTimer); saveTimer=setTimeout(save,300); }
function saveUi(){ clearTimeout(uiTimer); uiTimer=0; try{ localStorage.setItem(UIKEY, JSON.stringify(U)); }catch(_){} }
function saveUiSoon(){ clearTimeout(uiTimer); uiTimer=setTimeout(saveUi,300); }
function flush(){ if(saveTimer) save(); if(uiTimer) saveUi(); }
addEventListener("pagehide",flush); addEventListener("beforeunload",flush);
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flush(); });
addEventListener("storage", e=>{
  if(e.key!==KEY || e.newValue==null) return;
  let o=null; try{ o=normalize(JSON.parse(e.newValue)); }catch(_){}
  if(!o) return;
  stampAll(S); const before=stable(S);
  S=merge2(S,o.data); lastRaw=e.newValue;
  const after=stable(S);
  if(after!==before) renderKeep();
  if(after!==stable(o.data)) saveSoon();   // we hold something the other tab doesn't
});

function toast(m, undo, isErr){
  if(!isErr && saveErr && Date.now()-saveErr<4000) return;   // don't hide a failed-save warning behind "Saved"
  const t=$("#toast"); t.innerHTML=esc(m)+(undo?' <button class="btn s" data-act="undo">Undo</button>':"");
  t.classList.toggle("undo",!!undo); t.classList.add("on"); t.setAttribute("role","status");
  toast._undo=undo||null; clearTimeout(toast._t);
  toast._t=setTimeout(()=>{ t.classList.remove("on","undo"); toast._undo=null; }, undo?8000:(isErr?5000:1800));
}

function linkify(u){ if(!u) return ""; const ok=/^https?:\/\//i.test(u); return ok?`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/,"").slice(0,48))}</a>`:esc(u); }
async function copy(text, what){
  let ok=false;
  try{ await navigator.clipboard.writeText(text); ok=true; }
  catch(e){ const ta=document.createElement("textarea"); ta.value=text; document.body.appendChild(ta); ta.select(); try{ ok=document.execCommand("copy"); }catch(_){} ta.remove(); }
  toast(ok?(what||"Prompt")+" copied":"Couldn't copy automatically. Select the text and copy it.");
}

/* ---------- derived stats ---------- */
function stats(){
  const days = new Set(S.ideas.map(i=>dayKey(i.createdAt)));
  const creatorSources = S.sources.filter(s=>s.kind===SOURCE_KINDS[2]).length;
  const fullAngles = S.ideas.filter(i=>anglesDone(i)===5).length;
  const posted = S.posts.filter(p=>p.status==="posted");
  const tracked = posted.filter(p=>(+p.replies||0)>0 || (p.questions||[]).length).length;
  const questions = posted.reduce((n,p)=>n+(p.questions||[]).length,0);
  const studied = S.creators.filter(c=>S.ideas.some(i=>i.creatorId===c.id)).length;
  return {days:days.size, creatorSources, fullAngles, posted:posted.length, tracked, questions, studied,
    fav:S.ideas.filter(i=>i.board==="favorite").length, val:S.ideas.filter(i=>i.board==="validated").length,

function a11y(){
  document.querySelectorAll("#app input,#app textarea,#app select").forEach(el=>{
    if(el.getAttribute("aria-label")||el.closest("label")) return;
    const p=el.previousElementSibling;

    if(name) el.setAttribute("aria-label",name);

}
// Re-render without stealing the cursor (used when another tab changes data)
function renderKeep(){
  const a=document.activeElement; let sel=null, s0=0, s1=0;
  if(a && a!==document.body && a.closest("#app")){
    if(a.id) sel="#"+CSS.escape(a.id);
    else { const at=[...a.attributes].filter(x=>x.name.startsWith("data-")).map(x=>`[${x.name}="${CSS.escape(x.value)}"]`).join(""); if(at) sel=a.tagName.toLowerCase()+at; }
    try{ s0=a.selectionStart; s1=a.selectionEnd; }catch(_){}
  }

  if(sel){ const n=document.querySelector(sel); if(n){ n.focus({preventScroll:true}); try{ if(s0!=null) n.setSelectionRange(s0,s1); }catch(_){} } }

/* ---------- sync with a private GitHub repository ----------
   This device's localStorage is always the source of truth. Sync pulls the data file from the repo,
   merges it with the local copy (same merge as between tabs: nothing is silently dropped), and pushes
   the result back using GitHub's sha check so two devices can't overwrite each other.
   The token lives only in this browser (SYNCKEY). It is never exported and never written to the repo. */
const SYNCKEY = KEY+".sync";
const API = "https://api.github.com";
const FILE = "idea-catcher-data.json";
const DEFAULT_OWNER = "pexreyes", DEFAULT_REPO = "idea-catcher-data";   // Pex's repos; editable in the form
let SY = readSync();
const syncState = {state:"off", msg:"", gen:0, running:false, again:false, blocked:false, retryTimer:0, debounce:0, backoff:0, applying:false, connectMsg:"", connectBusy:false, qr:false, warn:""};
function readSync(){ try{ const o=JSON.parse(localStorage.getItem(SYNCKEY)||"null"); if(isObj(o)) return o; }catch(_){} return {}; }
function writeSync(){ try{ localStorage.setItem(SYNCKEY, JSON.stringify(SY)); }catch(_){} }
const connected = () => !!(SY.token && SY.owner && SY.repo);
const sleep = ms => new Promise(r=>setTimeout(r,ms));
const hm = t => new Date(t).toLocaleTimeString(undefined,{hour:"numeric",minute:"2-digit"});
function b64enc(str){ const b=new TextEncoder().encode(str); let s=""; for(let i=0;i<b.length;i+=0x8000) s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000)); return btoa(s); }
function b64dec(b64){ const s=atob(String(b64).replace(/\s/g,"")); const b=new Uint8Array(s.length); for(let i=0;i<s.length;i++) b[i]=s.charCodeAt(i); return new TextDecoder().decode(b); }
const b64url = s => b64enc(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const b64urlDec = s => b64dec(s.replace(/-/g,"+").replace(/_/g,"/"));
function deviceName(){ const u=navigator.userAgent; return /Android/i.test(u)?"Android phone":/iPhone|iPad/i.test(u)?"iPhone/iPad":/Macintosh|Mac OS/i.test(u)?"Mac":/Windows/i.test(u)?"PC":"a browser"; }
class SyncErr extends Error{ constructor(kind,msg,extra){ super(msg); this.kind=kind; Object.assign(this,extra||{}); } }
const repoPath = c => `/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}`;

async function gh(method, p, body, cfg){
  let res;
  try{
    res = await fetch(API+p, {method, cache:"no-store", headers:Object.assign({"Authorization":"Bearer "+cfg.token, "Accept":"application/vnd.github+json", "X-GitHub-Api-Version":"2022-11-28"}, body?{"Content-Type":"application/json"}:{}), body:body?JSON.stringify(body):undefined});
  }catch(e){ throw new SyncErr(navigator.onLine===false?"offline":"network", "Can't reach GitHub right now."); }
  let json=null; try{ json=await res.json(); }catch(_){}
  if(res.ok) return {status:res.status, json:json||{}};
  const h=k=>res.headers.get(k), remaining=h("x-ratelimit-remaining"), reset=+h("x-ratelimit-reset")||0, ra=+h("retry-after")||0;
  if(res.status===429 || (res.status===403 && (remaining==="0" || ra))){
    const wait = ra ? ra*1000 : reset ? Math.max(1000, reset*1000-Date.now()) : 60000;
    throw new SyncErr("rate", `GitHub asked to slow down. Your changes are safe on this device and will sync at ${hm(Date.now()+wait)}.`, {wait});
  }
  if(res.status===401) throw new SyncErr("auth", "GitHub didn't accept the token. It has probably expired or was deleted. Make a new token (see SETUP.md) and paste it under \"Replace token\" below. Your ideas on this device are safe.");
  if(res.status===403) throw new SyncErr("forbidden", `This token isn't allowed to change ${cfg.owner}/${cfg.repo}. When you create the token, pick this repository and set "Contents" to "Read and write". Your ideas on this device are safe.`);
  if(res.status===404) throw new SyncErr("notfound", `Can't find the repository ${cfg.owner}/${cfg.repo} with this token. Check the spelling, and that the token was given access to this repository.`);
  if(res.status===409 || res.status===422) throw new SyncErr("stale", "Another device saved at the same moment.");
  throw new SyncErr("server", `GitHub had a problem (error ${res.status}). Trying again shortly.`);
}
async function readRemote(cfg){
  let r;
  try{ r = await gh("GET", repoPath(cfg)+"/contents/"+FILE, null, cfg); }
  catch(e){ if(e.kind!=="notfound") throw e; await gh("GET", repoPath(cfg), null, cfg); return null; }  // repo exists, file not yet: first sync creates it
  let content = r.json.content;
  if(!content && r.json.sha){ const b = await gh("GET", repoPath(cfg)+"/git/blobs/"+encodeURIComponent(r.json.sha), null, cfg); content = b.json.content; } // files over 1 MB
  let n=null; try{ n=normalize(JSON.parse(b64dec(content||""))); }catch(_){}
  if(!n) throw new SyncErr("damaged", `The data file (${FILE}) in ${cfg.owner}/${cfg.repo} can't be read, so it was left untouched. Your ideas on this device are safe. You can restore an older version of that file on github.com (History).`);
  return {sha:r.json.sha, data:n.data};
}
async function writeRemote(cfg, sha, data){
  const body = {message:`Idea Catcher sync from ${deviceName()}`, content:b64enc(JSON.stringify(data))};
  if(sha) body.sha = sha;
  const r = await gh("PUT", repoPath(cfg)+"/contents/"+FILE, body, cfg);
  return r.json.content && r.json.content.sha;
}
function setSync(state, msg){ syncState.state=state; syncState.msg=msg||""; updatePill(); if(U.tab==="sync") renderKeep(); }
function updatePill(){
  const b=$("#syncPill"); if(!b) return;
  const st = connected() ? syncState.state : "off";
  const label = {off:"Sync: off", idle:"Sync", syncing:"Syncing…", ok:"Synced", offline:"Offline", error:"Sync error"}[st] || "Sync";
  const dot = {ok:"var(--good)", syncing:"var(--accent2)", offline:"var(--muted)", error:"var(--bad)"}[st] || "var(--muted)";
  b.innerHTML = `<span class="dot" style="background:${dot}" aria-hidden="true"></span>${label}`;
  b.dataset.syncState = st; b.dataset.syncGen = syncState.gen;
  b.title = connected() ? (st==="ok"&&SY.lastSync ? "Last synced "+hm(SY.lastSync) : syncState.msg || label) : "Set up sync between your devices";
  b.setAttribute("aria-label", "Sync status: "+label+(SY.lastSync&&connected()?", last synced "+hm(SY.lastSync):""));
}
function scheduleRetry(ms){ clearTimeout(syncState.retryTimer); syncState.retryTimer=setTimeout(()=>runSync("retry"), ms); }
function scheduleSync(){ if(!connected() || syncState.applying) return; clearTimeout(syncState.debounce); syncState.debounce=setTimeout(()=>runSync("edit"), 2500); }
async function runSync(reason){
  if(!connected()) return;
  if(syncState.blocked && reason!=="manual" && reason!=="connect") return;   // needs the user to fix the token/repo
  if(syncState.running){ syncState.again=true; return; }
  clearTimeout(syncState.debounce); clearTimeout(syncState.retryTimer);
  if(navigator.onLine===false){ setSync("offline","No internet connection. Your changes are saved on this device and will sync when you're back online."); return; }
  syncState.running=true; setSync("syncing");
  const work = async () => {
    for(let attempt=0;;attempt++){
      const cfg = {owner:SY.owner, repo:SY.repo, token:SY.token};
      try{
        flush();
        const remote = await readRemote(cfg);
        if(SY.token!==cfg.token) return;                    // disconnected or changed while we waited
        if(remote){
          stampAll(S); const before=stable(S);
          S = merge2(S, remote.data);
          if(stable(S)!==before){ syncState.applying=true; save(); syncState.applying=false; renderKeep(); }
        }
        stampAll(S);
        if(!remote || stable(S)!==stable(remote.data)){
          const sha = await writeRemote(cfg, remote && remote.sha, S);
          if(SY.token===cfg.token){ SY.sha = sha; }
        }
        if(SY.token!==cfg.token) return;
        SY.lastSync = Date.now(); writeSync();
        syncState.backoff=0; syncState.blocked=false; setSync("ok");
        return;
      }catch(e){
        if(SY.token!==cfg.token) return;
        const retriable = e.kind==="stale" || e.kind==="server" || e.kind==="network";
        if(retriable && attempt<5){ await sleep(Math.min(8000, 400*Math.pow(2,attempt))*(0.6+Math.random()*0.8)); continue; }
        syncErr(e); return;
      }
    }
  };
  try{ if(navigator.locks && navigator.locks.request) await navigator.locks.request("idea-catcher-sync", work); else await work(); }
  catch(e){ syncErr(e instanceof SyncErr ? e : new SyncErr("server","Sync stopped unexpectedly. Trying again shortly.")); }
  finally{
    syncState.running=false; syncState.gen++; updatePill(); if(U.tab==="sync") renderKeep();
    if(syncState.again){ syncState.again=false; setTimeout(()=>runSync("again"), 50); }
  }
}
function syncErr(e){
  const next = () => { syncState.backoff = Math.min(300000, syncState.backoff ? syncState.backoff*2 : 5000); return syncState.backoff; };
  if(e.kind==="offline" || e.kind==="network"){ setSync("offline", "Can't reach GitHub. Your changes are saved on this device and will sync when the connection is back."); scheduleRetry(next()); }
  else if(e.kind==="rate"){ setSync("error", e.message); scheduleRetry(e.wait); }
  else if(e.kind==="server" || e.kind==="stale"){ setSync("error", e.kind==="stale" ? "Several devices kept saving at the same moment. Trying again shortly." : e.message); scheduleRetry(next()); }
  else { syncState.blocked=true; setSync("error", e.message); }   // auth / forbidden / notfound / damaged: wait for the user
}
function parseRepo(owner, repo){
  owner=String(owner||"").trim(); repo=String(repo||"").trim();
  const m = repo.match(/github\.com\/([\w.-]+)\/([\w.-]+?)(?:\.git)?(?:[\/?#].*)?$/i) || repo.match(/^([\w.-]+)\/([\w.-]+)$/);
  if(m){ owner=m[1]; repo=m[2]; }
  return {owner, repo};
}
async function connectSync(cfg){
  const {owner, repo} = parseRepo(cfg.owner, cfg.repo); const token=String(cfg.token||"").trim();
  if(!/^[\w.-]{1,100}$/.test(owner) || !/^[\w.-]{1,100}$/.test(repo)) { syncState.connectMsg="Enter your GitHub username and the data repository name (for example idea-catcher-data)."; return renderKeep(); }
  if(token.length<20 || /\s/.test(token)) { syncState.connectMsg="Paste the whole token. It starts with github_pat_."; return renderKeep(); }
  if(navigator.onLine===false){ syncState.connectMsg="You're offline. Connect when you have internet."; return renderKeep(); }
  syncState.connectBusy=true; syncState.connectMsg="Checking with GitHub…"; renderKeep();
  try{
    const r = await gh("GET", repoPath({owner,repo}), null, {owner,repo,token});
    syncState.warn = r.json && r.json.private===false ? `Warning: ${owner}/${repo} is public, so anyone can read your ideas. On github.com open the repo → Settings → scroll down → Change visibility → Private.` : "";
    SY = {owner, repo, token, connectedAt:Date.now()}; writeSync();
    syncState.connectMsg=""; syncState.blocked=false; syncState.backoff=0; syncState.connectBusy=false;
    toast(`Connected to ${owner}/${repo}`);
    await runSync("connect");
  }catch(e){
    syncState.connectBusy=false;
    syncState.connectMsg = e.kind==="offline"||e.kind==="network" ? "Can't reach GitHub. Check your internet connection and try again." : e.message;
    renderKeep();
  }
}
function disconnectSync(){
  clearTimeout(syncState.retryTimer); clearTimeout(syncState.debounce);
  SY = {owner:SY.owner, repo:SY.repo}; writeSync();   // token removed; repo name kept only to pre-fill the form
  syncState.qr=false; syncState.blocked=false; setSync("off");
  toast("Disconnected. Your ideas stay on this device.");
}
function connectLink(){ return location.href.split("#")[0].split("?")[0] + "#connect=" + b64url(JSON.stringify({v:1, o:SY.owner, r:SY.repo, t:SY.token})); }
function takeConnectFragment(){
  if(!/^#connect=/.test(location.hash)) return null;
  const raw = location.hash.slice(9);
  history.replaceState(null, "", location.href.split("#")[0]);   // the token never stays in the address bar or history entry
  try{ const o=JSON.parse(b64urlDec(raw)); if(o && o.o && o.r && o.t) return {owner:o.o, repo:o.r, token:o.t}; }catch(_){}
  notice = "That connect link is broken or incomplete. On your other device open Sync → Connect another device and scan the code again.";
  return null;
}
function qrSvg(text){
  try{ const q=qrcode(0,"L"); q.addData(text); q.make(); return q.createSvgTag({cellSize:4, margin:16, scalable:true, alt:"QR code that connects another device to your sync"}); }
  catch(_){ return '<p class="small">This link is too long for a QR code. Use Copy link instead.</p>'; }
}

  return `

    <h2 style="margin:0 0 6px">${esc(stateText)}</h2>
    ${on?`<div class="small">Connected to <b>${esc(SY.owner)}/${esc(SY.repo)}</b>${SY.lastSync?` · last synced ${esc(hm(SY.lastSync))}, ${esc(fmt(SY.lastSync))}`:""}</div>`:""}
    ${on&&syncState.msg?`<p class="${st==="error"?"warn":"small"}" style="margin:8px 0 0">${esc(syncState.msg)}</p>`:""}
    ${on&&syncState.warn?`<p class="warn" style="margin:8px 0 0">${esc(syncState.warn)}</p>`:""}
  </div>
  ${on?`
  <div class="row" style="margin-bottom:14px">
    <button class="btn p" data-act="syncNow" ${syncState.running?"disabled":""}>Sync now</button>
    <button class="btn" data-act="showQr">Connect another device</button>
    <button class="btn ghost danger" data-act="disconnect">Disconnect</button>
  </div>
  ${syncState.qr?`<div class="card hl" id="qrCard">
    <h2>Connect your phone or another computer</h2>
    <p class="small" style="margin-top:-4px">On the other device, scan this with the camera, or open the link. It connects by itself.</p>
    <div class="qr" id="qrBox">${qrSvg(connectLink())}</div>
    <p class="warn"><b>Treat this code and link like a password.</b> Anyone who has them can read and change your ideas. Don't post or forward them, and close this box when you're done.</p>
    <label for="qrLink">Connect link</label><input id="qrLink" readonly value="${esc(connectLink())}">
    <div class="row" style="margin-top:8px"><button class="btn s" data-act="copyLink">Copy link</button><button class="btn s ghost" data-act="hideQr">Hide</button></div>
  </div>`:""}
  <details><summary>Replace token (when it expires)</summary>
    <label for="syNewToken">New token</label><input id="syNewToken" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_...">
    <div class="row" style="margin-top:8px"><button class="btn s p" data-act="replaceToken">Save new token</button></div>
  </details>`:`
  <div class="card">
    <h2>Connect (once per device)</h2>
    <p class="small" style="margin-top:-4px">Already connected on another device? Open Sync there, tap <b>Connect another device</b>, and scan the code with this device instead.</p>
    <div class="grid2">
      <div><label for="syOwner">Your GitHub username</label><input id="syOwner" autocomplete="off" spellcheck="false" autocapitalize="none" value="${esc(SY.owner||DEFAULT_OWNER)}" placeholder="pexreyes"></div>
      <div><label for="syRepo">Data repository name</label><input id="syRepo" autocomplete="off" spellcheck="false" autocapitalize="none" value="${esc(SY.repo||DEFAULT_REPO)}" placeholder="idea-catcher-data"></div>
    </div>
    <label for="syToken">Token</label><input id="syToken" type="password" autocomplete="off" spellcheck="false" placeholder="github_pat_...">
    ${syncState.connectMsg?`<p class="warn" role="alert">${esc(syncState.connectMsg)}</p>`:""}
    <div class="row" style="margin-top:12px"><button class="btn p" data-act="connect" ${syncState.connectBusy?"disabled":""}>Connect</button><span class="small">The token stays on this device only. It's never put in exports or in the repo.</span></div>
  </div>`}
  <div class="next"><button class="btn ghost" data-tab="start">← Back to Start</button></div>`;
}

addEventListener("storage", e=>{ if(e.key===SYNCKEY){ SY=readSync(); if(!connected()) syncState.state="off"; updatePill(); if(U.tab==="sync") renderKeep(); } });

/* ---------- events ---------- */
const isFormId = id => FORM.has(id) || /^(q_|edit_)/.test(id);
function clearForm(...ids){ ids.forEach(k=>delete U.form[k]); }
function removeWithUndo(col, id, label, after, undoAfter){
  const arr=S[col], idx=arr.findIndex(x=>x.id===id); if(idx<0) return;
  const item=arr[idx]; stamp(item); arr.splice(idx,1);
  S.deleted[id]={at:Date.now(), h:item._h};
  const extra = after ? after(item) : null;
  save(); render();
  toast(label+" deleted", ()=>{
    delete S.deleted[id]; item.restoredAt=Date.now();   // a restore counts as a new edit, so no other copy re-deletes it
    if(!S[col].some(x=>x.id===id)) S[col].push(item);
    if(undoAfter) undoAfter(item, extra);
    save(); render(); toast(label+" restored");
  });
}

    },

    cancelEdit(){ clearForm("edit_"+U.editIdea); U.editIdea=""; saveUi(); render(); },
    saveEdit(){ const i=idea(id), n=document.getElementById("edit_"+id); if(!i||!n) return; const v=n.value.trim(); if(!v) return toast("An idea can't be empty. Use Delete instead.");
      i.text=v; clearForm("edit_"+id); U.editIdea=""; save(); render(); toast("Idea updated"); },
    delIdea(){ removeWithUndo("ideas", id, "Idea"); },
    toAngle(){ U.angleIdea=id; go("angle"); },
    pairThis(){ U.draftValidated=id; go("draft"); },
    addSource(){
      const name=$("#srcName").value.trim(); if(!name) return toast("Name the source");

      clearForm("srcName","srcUrl","srcNote"); save(); render(); toast("Source added");
    },
    delSource(){ removeWithUndo("sources", id, "Source"); },
    opinion(){ U.srcCapture=id; render(); setTimeout(()=>$("#opText")&&$("#opText").focus(),0); },
    cancelOpinion(){ U.srcCapture=""; clearForm("opText"); saveUi(); render(); },
    saveOpinion(){
      const text=$("#opText").value.trim(); if(!text) return toast("Write your opinion first");
      const s=S.sources.find(x=>x.id===id); const nid=uid();
      S.ideas.push({id:nid,text,type:"Anything else",board:"favorite",source:s?(s.url||s.name):"",createdAt:Date.now()});

    },
    addCreator(){
      const name=$("#crName").value.trim(); if(!name) return toast("Add the creator's name");

      clearForm("crName","crUrl","crNote"); save(); render(); toast("Creator saved");
    },
    delCreator(){ removeWithUndo("creators", id, "Creator",
      c=>{ const linked=S.ideas.filter(i=>i.creatorId===c.id).map(i=>i.id); S.ideas.forEach(i=>{ if(i.creatorId===c.id) i.creatorId=""; }); return linked; },
      (c,linked)=>{ (linked||[]).forEach(iid=>{ const i=idea(iid); if(i&&!i.creatorId) i.creatorId=c.id; }); }); },
    swipe(){ U.swipeFor=id; render(); },
    cancelSwipe(){ U.swipeFor=""; clearForm("swText","swUrl","swWhy","swPrin"); saveUi(); render(); },
    saveSwipe(){
      const text=$("#swText").value.trim(); if(!text) return toast("Paste or describe the post");
      S.ideas.push({id:uid(),text,type:"Social post that inspired me",board:"validated",source:$("#swUrl").value.trim(),why:$("#swWhy").value.trim(),principle:$("#swPrin").value.trim(),creatorId:id,createdAt:Date.now()});
      U.swipeFor=""; clearForm("swText","swUrl","swWhy","swPrin"); save(); render(); toast("Added to swipe file");
    },
    copy(){ copy(t.dataset.prompt==="study"?studyPrompt():anglePrompt(currentAngleIdea())); },
    star(){
      const cur = currentAngleIdea(); if(!cur) return; const a=angleData(cur); const k=+t.dataset.k;
      if(a.stars.includes(k)) a.stars=a.stars.filter(x=>x!==k); else { a.stars.push(k); if(a.stars.length>2) a.stars.shift(); }
      save(); renderKeep();
    },
    toDraft(){ U.draftIdea=id; U.draftAngle=""; go("draft"); },
    saveDraft(){
      const text=$("#drText").value.trim(); if(!text) return toast("Write the post first");
      const f=draftIdea();
      const angSel=document.querySelector('[data-pick="draftAngle"]');
      S.posts.push({id:uid(),ideaId:f?f.id:"",validatedId:U.draftValidated||"",angleIdx:angSel?+angSel.value:null,platform:$("#drPlat").value,text,status:"draft",createdAt:Date.now(),replies:0,questions:[]});
      clearForm("drText"); save(); render(); toast("Draft saved");
    },
    markPosted(){ const p=S.posts.find(x=>x.id===id); if(!p) return; p.status="posted"; p.postedAt=Date.now(); save(); render(); toast("Marked as posted"); },
    unpost(){ const p=S.posts.find(x=>x.id===id); if(!p) return; p.status="draft"; delete p.postedAt; save(); render(); toast("Moved back to drafts"); },
    delPost(){ removeWithUndo("posts", id, "Post"); },
    addQ(){ const inp=$("#q_"+CSS.escape(id)); const v=inp?inp.value.trim():""; if(!v){ if(inp) inp.focus(); return toast("Paste the question first"); }
      const p=S.posts.find(x=>x.id===id); if(!p) return; (p.questions=p.questions||[]).push({id:uid(),text:v}); clearForm("q_"+id); save(); render(); },
    delQ(){ const p=S.posts.find(x=>x.id===id); if(!p) return; const qi=p.questions.findIndex(q=>q.id===t.dataset.q); if(qi<0) return; const q=p.questions[qi];
      p.questions.splice(qi,1); save(); render();
      toast("Question deleted", ()=>{ const pp=S.posts.find(x=>x.id===id); if(pp && !pp.questions.some(x=>x.id===q.id)){ pp.questions.splice(Math.min(qi,pp.questions.length),0,q); save(); render(); toast("Question restored"); } }); },
    useQ(){ U.guideQ=id+"|"+t.dataset.q; go("guide"); },
    newGuide(){
      let q=$("#gQText").value.trim(), postId="";
      const sel=$("#gQ").value;
      if(!q && sel){ const [pid,qid]=sel.split("|"); const p=S.posts.find(x=>x.id===pid); const qq=p&&p.questions.find(x=>x.id===qid); if(qq){q=qq.text; postId=pid;} }
      if(!q) return toast("Pick or type one question");
      S.guides.push({id:uid(),question:q,postId,title:"",body:"",emailLink:"",made:false,out:false,larger:false,createdAt:Date.now()});

    },
    delGuide(){ removeWithUndo("guides", id, "Guide"); },
    undo(){ const f=toast._undo; toast._undo=null; $("#toast").classList.remove("on","undo"); if(f) f(); },
    more(){ const k=t.dataset.key; U.limits[k]=(U.limits[k]||LIM)+LIM; saveUi(); renderKeep(); },
    resolve(){ const it=(S[t.dataset.kind]||[]).find(x=>x.id===id); if(it){ delete it.conflictOf; delete it.conflictAt; save(); render(); } },
    useConflict(){ const c=S.conflicts.find(x=>x.id===id); if(!c) return; Object.assign(S[c.what], c.value); S.conflicts=S.conflicts.filter(x=>x.id!==id); save(); render(); toast("Switched to that version"); },
    dropConflict(){ S.conflicts=S.conflicts.filter(x=>x.id!==id); save(); render(); },
    dismissNotice(){ notice=""; render(); },
    openSync(){ go("sync"); },
    connect(){ connectSync({owner:$("#syOwner").value, repo:$("#syRepo").value, token:$("#syToken").value}); },
    syncNow(){ syncState.blocked=false; syncState.backoff=0; runSync("manual"); },
    disconnect(){ disconnectSync(); },
    showQr(){ syncState.qr=true; render(); },
    hideQr(){ syncState.qr=false; render(); },
    copyLink(){ copy(connectLink(),"Link"); },
    replaceToken(){ const v=$("#syNewToken").value.trim(); if(v.length<20) return toast("Paste the whole new token"); connectSync({owner:SY.owner, repo:SY.repo, token:v}); },
    import(){ $("#importFile").click(); },
    export(){
      flush();
      const blob=new Blob([JSON.stringify(S,null,2)],{type:"application/json"});
      const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
      a.download="idea-catcher-"+new Date().toISOString().slice(0,10)+".json"; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href),4000);

  };
  if(A[act]) A[act]();
});
document.addEventListener("input", e=>{
  const t=e.target; if(!t.isConnected) return;
  if(t.id && isFormId(t.id)){ U.form[t.id]=t.value; saveUiSoon(); return; }
  if(t.dataset.set!==undefined){ S.settings[t.dataset.set]=t.value; saveSoon(); return; }
  if(t.dataset.angle!==undefined){ const c=currentAngleIdea(); if(!c) return; angleData(c).answers[+t.dataset.angle]=t.value; saveSoon(); const b=document.querySelector('[data-act="toDraft"]'); if(b) b.disabled=!angleData(c).answers.some(x=>x.trim()); return; }
  if(t.dataset.extra!==undefined){ const c=currentAngleIdea(); if(c){ angleData(c).extra=t.value; saveSoon(); } return; }
  if(t.dataset.post){ const p=S.posts.find(x=>x.id===t.dataset.post); if(!p) return; p[t.dataset.field]=t.dataset.field==="replies"?Math.max(0,Math.floor(+t.value||0)):t.value; saveSoon(); return; }
  if(t.dataset.guide){ const g=S.guides.find(x=>x.id===t.dataset.guide); if(!g) return; g[t.dataset.field]=t.value; saveSoon(); return; }
  if(t.dataset.filter!==undefined){ U.filter=t.value; saveUiSoon(); renderKeep(); }
});
document.addEventListener("change", e=>{
  const t=e.target;
  if(t.name==="capBoard"){ U.form.capBoard=t.value; saveUiSoon(); $("#whyWrap").style.display=t.value==="validated"?"block":"none"; return; }
  if(!t.isConnected) return;   // a field removed by a re-render can still fire "change" with its old text
  if(t.id && isFormId(t.id)){ if(t.tagName==="SELECT"){ U.form[t.id]=t.value; saveUiSoon(); } return; }
  if(t.dataset.pick){ U[t.dataset.pick]=t.value; if(t.dataset.pick==="draftIdea") U.draftAngle=""; saveUi(); renderKeep(); return; }
  if(t.dataset.rate!==undefined){ const c=currentAngleIdea(); if(!c) return; const a=angleData(c); const k=t.dataset.rate; a.rate[k]=a.rate[k]||{}; a.rate[k][t.dataset.x]=t.checked; save(); return; }
  if(t.dataset.plan){ S.plan[t.dataset.plan]=t.checked; save(); renderKeep(); return; }
  if(t.dataset.gcheck){ const g=S.guides.find(x=>x.id===t.dataset.gcheck); if(!g) return; g[t.dataset.field]=t.checked; save(); return; }
  if(t.id==="importFile" && t.files && t.files[0]){
    const file=t.files[0]; const r=new FileReader();
    r.onerror=()=>{ toast("Couldn't read that file. Nothing changed."); t.value=""; };
    r.onload=()=>{
      t.value="";
      let n=null; try{ n=normalize(JSON.parse(r.result)); }catch(_){}
      if(!n){ toast("That file isn't an Idea Catcher backup. Nothing changed."); return; }
      flush();
      try{ localStorage.setItem(KEY+".before-import", JSON.stringify(S)); }catch(_){}
      const before={ideas:S.ideas.length, posts:S.posts.length};
      S=merge2(S,n.data); save(); render();
      const added=S.ideas.length-before.ideas;
      toast(`Imported and merged with what you had${added>0?` (${added} new idea${added===1?"":"s"})`:""}.`);
    };
    r.readAsText(file);
  }
});
